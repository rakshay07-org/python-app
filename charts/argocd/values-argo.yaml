redis-ha:
  enabled: false

controller:
  replicas: 1

server:
  replicas: 1
  # serve plain HTTP; avoids self-signed cert issues on localhost
  extraArgs:
    - --insecure
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    tls: false

repoServer:
  replicas: 1

applicationSet:
  replicas: 1

global:
  domain: localhost

certificate:
  enabled: false